[project]
name = "version-manager-backend"
version = "0.1.0"
description = "Version management backend: store aggregator, policy engine and version API for flutter_app_version_upgrader."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "PyJWT[crypto]>=2.8",
  "google-auth>=2.30",
  "google-api-python-client>=2.130",
  "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
